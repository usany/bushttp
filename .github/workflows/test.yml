name: Test

on:
  push:
    branches: [ main, bravo ]
  pull_request:
    branches: [ main, bravo ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Deno
      uses: denoland/setup-deno@v1
      with:
        deno-version: v1.x
        
    - name: Cache dependencies
      run: deno cache --lock=deno.lock main.ts main.test.ts
      
    - name: Run tests
      run: deno test --allow-net --allow-env --allow-read --allow-run main.test.ts
      
    - name: Check formatting
      run: deno fmt --check
      
    - name: Run linter
      run: deno lint
